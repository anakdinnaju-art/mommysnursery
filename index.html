<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mommy's Nursery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#F2F5F0;--card:#FFFFFF;--ink:#1B2A27;--muted:#5E6E6A;--line:#DCE3DF;--green:#2F7A5B;--green-ink:#FFFFFF;--green-soft:#DDEEE5;--amber:#F0B93B;--amber-soft:#FBEFC8;--amber-ink:#5C4400;--red:#B8452F;--red-soft:#F6DED8;--blue-soft:#DCE8F3;--blue-ink:#22496B;--radius:18px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131A18;--card:#1C2522;--ink:#EEF3F0;--muted:#9BABA5;--line:#2C3833;--green:#4FB287;--green-ink:#0E1F18;--green-soft:#1F3A2E;--amber:#E3B03A;--amber-soft:#4A3A12;--amber-ink:#FBE8B5;--red:#E0705A;--red-soft:#4A2620;--blue-soft:#20334A;--blue-ink:#BBD3EC}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:16px;line-height:1.45}
body{display:flex;justify-content:center;min-height:100vh}
.phone{width:100%;max-width:480px;min-height:100vh;display:flex;flex-direction:column;position:relative}
header.top{padding:14px 20px 8px;display:flex;align-items:center;gap:12px}
.logo{width:52px;height:52px;object-fit:contain;flex:none}
header.top h1{margin:0;font-size:23px;font-weight:800;letter-spacing:-.3px}
header.top .date{color:var(--muted);font-weight:700;font-size:13px}
main{flex:1;padding:8px 16px 96px;overflow-y:auto}
.screen{display:none}.screen.active{display:block}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;border:1px solid var(--line)}
h2{font-size:18px;margin:6px 0 10px;font-weight:800}
.sub{font-size:13px;color:var(--muted);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 12px}
.stat b{display:block;font-size:30px;font-weight:800;line-height:1}
.stat span{font-size:13px;color:var(--muted);font-weight:700}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row.click{cursor:pointer}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-weight:800;flex:none;font-size:15px}
.avatar.off{background:var(--line);color:var(--muted)}
.avatar.in{background:var(--amber);color:#3B2C00}
.tap{min-width:104px;min-height:52px;padding:0 14px;font-size:16px;color:var(--green-ink);background:var(--green);border-radius:14px}
.tap.out{background:var(--amber);color:#3B2C00}
.tap.done{background:var(--line);color:var(--muted);cursor:default}
.pill.amber{background:var(--amber-soft);color:var(--amber-ink)}
.pill.red{background:var(--red-soft);color:var(--red)}
.card.warn{background:var(--amber-soft);border-color:transparent}
.card.warn h2{color:var(--amber-ink)}
.stat.in b{color:var(--amber-ink)}.stat.in{background:var(--amber-soft);border-color:transparent}
.grow{flex:1;min-width:0}
.name{font-weight:800;font-size:16px}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--green-soft);color:var(--green);white-space:nowrap}
.pill.blue{background:var(--blue-soft);color:var(--blue-ink)}
.pill.grey{background:var(--line);color:var(--muted)}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;font-weight:800;color:var(--ink);background:var(--line)}
.btn{background:var(--green);color:var(--green-ink);padding:14px 18px;font-size:16px;width:100%;min-height:52px;text-align:center;text-decoration:none;display:block;border-radius:14px}
.btn.ghost{background:transparent;color:var(--green);border:2px solid var(--green)}
.btn.danger{background:transparent;color:var(--red);border:2px solid var(--red)}
.btn.small{width:auto;min-height:44px;padding:10px 16px;font-size:15px}
.btn.wa{background:#25D366;color:#063B1F}
.btn[disabled]{opacity:.5;cursor:default}
label{display:block;font-size:13px;font-weight:800;color:var(--muted);margin:10px 0 4px}
.check{display:flex;gap:10px;align-items:center;margin:0;font-size:15px;color:var(--ink);padding:6px 0}
.check input{width:22px;height:22px;padding:0}
input,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px;margin-top:14px}
.back{background:none;color:var(--green);font-size:15px;padding:6px 0 10px}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px}
.chip.active{background:var(--green);color:var(--green-ink);border-color:var(--green)}
.empty{text-align:center;color:var(--muted);padding:24px 8px;font-weight:700}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
nav.tabs button{background:none;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:12px}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.active{color:var(--green);background:var(--green-soft)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:800;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center;z-index:20}
.toast.show{opacity:1}
.login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;z-index:30}
.login .card{width:100%;max-width:380px;text-align:center}
.login img{width:150px;height:150px;object-fit:contain}
.login input{text-align:left;margin-top:8px}
.msg{margin-top:12px;padding:12px;border-radius:12px;font-size:14px;font-weight:700;text-align:left;white-space:pre-wrap;display:none}
.msg.err{display:block;background:var(--red-soft);color:var(--red)}
.link{background:none;color:var(--green);font-size:14px;padding:8px;text-decoration:underline;width:auto;min-height:0}
.hide{display:none!important}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border-radius:0;background:var(--card);color:var(--muted);padding:8px 12px;font-size:13px}
.seg button.on{background:var(--green);color:var(--green-ink)}
.lines{width:100%;border-collapse:collapse;font-size:15px}
.lines td{padding:7px 0;border-top:1px solid var(--line);vertical-align:top}
.lines tr:first-child td{border-top:0}
.lines td:last-child{text-align:right;font-weight:800;white-space:nowrap}
.lines tr.total td{border-top:2px solid var(--ink);font-size:17px;font-weight:800}
.lines tr.group td{color:var(--green);font-weight:800;padding-top:12px}
.lines tr.neg td:last-child{color:var(--green)}
.btn.img{background:var(--blue-soft);color:var(--blue-ink)}
.rm{background:none;color:var(--red);text-decoration:underline;font-size:13px;padding:0 4px;min-height:0}
.qrprev{width:150px;height:150px;object-fit:contain;border:1px solid var(--line);border-radius:12px;margin-top:8px;background:#fff}
.center{display:flex;align-items:center;justify-content:center;min-height:70vh;color:var(--muted);font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBjcmlnanV1eW91dmxiendlZGJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1NjIwMjYsImV4cCI6MjEwNTEzODAyNn0.iOnwwBG_sQg_Z2DsdQTn8EnOsZsb-QdqLWwNvQrh4rg';

const $ = s => document.getElementById(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const initials = n => (n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const rm = n => 'RM ' + Number(n||0).toFixed(2);
const fmtDate = s => { if(!s) return ''; const [y,m,d]=s.split('-'); return `${d}/${m}/${y}`; };
const fmtTime = m => { if(m==null) return ''; let h=Math.floor(m/60),mm=m%60; const ap=h>=12?'PM':'AM'; h=h%12||12; return `${h}:${String(mm).padStart(2,'0')} ${ap}`; };
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1900); }

/* ---------- in-memory cache of the owner's data ---------- */
let settings=null, plans=[], parents=[], children=[], addons=[], attendance=[], invoices=[];
const num = v => v==null?0:Number(v);
const planById = id => plans.find(p=>p.id===id);
const planEnd  = c => { const p=planById(c.plan_id); return p?p.end_minutes:1020; };
const planLabel= c => { const p=planById(c.plan_id); return p?p.label:'—'; };
const active   = () => children.filter(c=>c.status==='active');
const siblings = c => children.filter(x=>x.parent_id===c.parent_id && x.id!==c.id);
const parentOf = c => parents.find(p=>p.id===c.parent_id);
const familyActive = p => children.some(c=>c.parent_id===p.id && c.status==='active');
const familyFormer = p => { const k=children.filter(c=>c.parent_id===p.id); return k.length>0 && !k.some(c=>c.status==='active'); };
const age = dob => { if(!dob) return ''; const d=new Date(dob), t=new Date(); let m=(t.getFullYear()-d.getFullYear())*12+t.getMonth()-d.getMonth(); if(t.getDate()<d.getDate()) m--; return m<24?`${m} months`:`${Math.floor(m/12)} years`; };
const todayISO = () => new Date().toISOString().slice(0,10);
const monthStart = () => todayISO().slice(0,8)+'01';
const nowMin = () => { const n=new Date(); return n.getHours()*60+n.getMinutes(); };
const toMin = s => { if(!s) return null; const [h,m]=s.split(':').map(Number); return h*60+m; };
const toHM  = m => m==null?'':`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const openMin = () => settings ? settings.open_minutes : 420;
const otEarly = rec => rec.time_in < openMin() ? Math.ceil((openMin()-rec.time_in)/60) : 0;
const otLate  = (rec,c) => (rec.time_out!=null && rec.time_out > planEnd(c)) ? Math.ceil((rec.time_out-planEnd(c))/60) : 0;
const recToday = id => attendance.find(a=>a.child_id===id && a.day===todayISO());
const openRecs = () => attendance.filter(a=>a.time_out==null && a.day < todayISO());
const nextMonth = m => { const [y,mm]=m.split('-').map(Number); const d=new Date(y,mm,1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; };
const monthLabel = m => { const [y,mm]=m.split('-'); return new Date(y,mm-1,1).toLocaleString('en-MY',{month:'long',year:'numeric'}); };
const recentMonths = n => { const out=[]; const d=new Date(); for(let i=0;i<n;i++){ out.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`); d.setMonth(d.getMonth()-1);} return out; };
const otRate = () => settings ? num(settings.overtime_rate) : 0;
const hourlyMinutes = (rec,c) => { if(rec.time_out==null) return 0; const st=Math.max(rec.time_in,openMin()), en=Math.min(rec.time_out,planEnd(c)); return Math.max(0,en-st); };
const recsMonth = (childId,month) => attendance.filter(a=>a.child_id===childId && a.day.startsWith(month) && a.time_out!=null);
const proposeMode = (c,month) => recsMonth(c.id,month).length <= (settings?settings.hourly_threshold:11) ? 'hourly' : 'monthly';
function computeChildLines(c, month, mode){
  const recs=recsMonth(c.id,month), lines=[];
  if(mode==='monthly') lines.push({kind:'base', desc:`${c.category} plan, monthly fixed (${recs.length} days)`, amt:num(c.monthly)});
  else { const mins=recs.reduce((s,r)=>s+hourlyMinutes(r,c),0); lines.push({kind:'base', desc:`Hourly: ${recs.length} days, ${Math.floor(mins/60)}h ${mins%60}m at ${rm(c.hourly)}/h`, amt:+((mins/60)*num(c.hourly)).toFixed(2)}); }
  let ot=0; recs.forEach(r=>{ ot+=otEarly(r)+otLate(r,c); });
  if(ot) lines.push({kind:'overtime', desc:`Overtime ${ot}h at ${rm(otRate())}/h (early / late)`, amt:+(ot*otRate()).toFixed(2)});
  (c.addons||[]).forEach(id=>{ const a=addons.find(x=>x.id===id); if(a) lines.push({kind:'addon', desc:`Add-on: ${a.name}`, amt:num(a.price)}); });
  return lines;
}
// invoice accessors (drafts compute live from attendance; sent/revised use frozen lines)
function invoiceGroups(inv){
  if(inv.stage==='draft') return inv.childModes.map(cm=>{ const c=children.find(x=>x.id===cm.child_id); return {child_id:cm.child_id, name:c?c.name:'—', mode:cm.mode, lines: c?computeChildLines(c,inv.month,cm.mode):[]}; });
  const byChild={}; inv.storedChildLines.forEach(l=>{ (byChild[l.child_id]=byChild[l.child_id]||[]).push(l); });
  return inv.childModes.map(cm=>{ const c=children.find(x=>x.id===cm.child_id); return {child_id:cm.child_id, name:c?c.name:'—', mode:cm.mode, lines:(byChild[cm.child_id]||[])}; });
}
const invoiceTotal   = inv => +([...invoiceGroups(inv).flatMap(g=>g.lines), ...inv.extras].reduce((s,l)=>s+l.amt,0)).toFixed(2);
const invoicePaid    = inv => +inv.payments.reduce((s,p)=>s+p.amt,0).toFixed(2);
const invoiceBalance = inv => +(invoiceTotal(inv)-invoicePaid(inv)).toFixed(2);
const invNames = inv => invoiceGroups(inv).map(g=>g.name).join(' & ');
const invNo    = inv => inv.no + (inv.rev?`-R${inv.rev}`:'');
function statusOf(inv){ if(inv.stage==='waived') return 'Waived'; if(inv.stage==='revised') return 'Revised'; if(inv.stage==='draft') return 'Draft'; const b=invoiceBalance(inv), pd=invoicePaid(inv); if(b<=0) return 'Paid'; if(pd>0) return 'Partially paid'; if(inv.due && todayISO()>inv.due) return 'Overdue'; return 'Sent'; }
const pillClass = st => ({Paid:'',Draft:'grey',Sent:'blue','Partially paid':'amber',Overdue:'red',Waived:'grey',Revised:'grey'})[st]||'';

async function loadAll(){
  const { error: bErr } = await sb.rpc('bootstrap_owner');
  if(bErr) throw bErr;
  const [s,pl,pa,ch,ad,ca,at,iv,ic,il,pm] = await Promise.all([
    sb.from('settings').select('*').maybeSingle(),
    sb.from('plans').select('*').order('end_minutes',{ascending:true}),
    sb.from('parents').select('*').order('created_at',{ascending:true}),
    sb.from('children').select('*').order('created_at',{ascending:true}),
    sb.from('addons').select('*').order('created_at',{ascending:true}),
    sb.from('child_addons').select('*'),
    sb.from('attendance').select('*').gte('day', monthStart()).order('day',{ascending:true}),
    sb.from('invoices').select('*').order('created_at',{ascending:true}),
    sb.from('invoice_children').select('*'),
    sb.from('invoice_lines').select('*'),
    sb.from('payments').select('*'),
  ]);
  for(const r of [s,pl,pa,ch,ad,ca,at,iv,ic,il,pm]) if(r.error) throw r.error;
  settings=s.data; plans=pl.data||[]; parents=pa.data||[]; children=ch.data||[]; addons=(ad.data||[]).map(a=>({...a,price:num(a.price)}));
  attendance=at.data||[];
  const { data:olderOpen } = await sb.from('attendance').select('*').is('time_out',null).lt('day',monthStart());
  (olderOpen||[]).forEach(a=>{ if(!attendance.some(x=>x.id===a.id)) attendance.push(a); });
  const caRows=ca.data||[];
  children.forEach(c=>{ c.monthly=num(c.monthly); c.hourly=num(c.hourly); c.addons=caRows.filter(r=>r.child_id===c.id).map(r=>r.addon_id); });
  const icRows=ic.data||[], ilRows=il.data||[], pmRows=pm.data||[];
  invoices=(iv.data||[]).map(r=>({ id:r.id, no:r.invoice_no, rev:r.rev, parent_id:r.parent_id, month:r.month, stage:r.stage, issued:r.issued, due:r.due, total:num(r.total),
    childModes: icRows.filter(x=>x.invoice_id===r.id).map(x=>({child_id:x.child_id, mode:x.mode})),
    storedChildLines: ilRows.filter(x=>x.invoice_id===r.id && x.child_id).map(x=>({id:x.id, child_id:x.child_id, kind:x.kind, desc:x.description, amt:num(x.amount)})),
    extras: ilRows.filter(x=>x.invoice_id===r.id && !x.child_id).map(x=>({id:x.id, desc:x.description, amt:num(x.amount)})),
    payments: pmRows.filter(x=>x.invoice_id===r.id).map(x=>({id:x.id, amt:num(x.amount), method:x.method, paid_on:x.paid_on})),
  }));
}

/* ---------- auth ---------- */
async function startApp(){
  $('login').classList.add('hide'); $('app').classList.remove('hide');
  $('today').textContent = new Date().toLocaleDateString('en-MY',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});

async function tapIn(id){
  if(recToday(id)){ toast('Already tapped in today'); return; }
  const row={ child_id:id, day:todayISO(), time_in:nowMin(), time_out:null };
  const { data, error } = await sb.from('attendance').insert(row).select().single();
  if(error){ toast(error.message); return; }
  attendance.push(data); toast(`${children.find(c=>c.id===id).name} tapped in`); render();
}
async function tapOut(id){
  const r=recToday(id); if(!r){ toast('Not tapped in yet'); return; }
  const out=Math.max(nowMin(), r.time_in+1);
  const { error } = await sb.from('attendance').update({time_out:out}).eq('id',r.id);
  if(error){ toast(error.message); return; }
  r.time_out=out; const l=otLate(r,children.find(c=>c.id===id)); toast(`Tapped out${l?`, ${l}h overtime`:''}`); render();
}
async function fixOpen(id){
  const el=$('ofix_'+id); const v=toMin(el&&el.value); if(v==null){ toast('Enter the time out'); return; }
  const r=attendance.find(a=>a.id===id); if(!r) return;
  const out=Math.max(v, r.time_in+1);
  const { error } = await sb.from('attendance').update({time_out:out}).eq('id',id);
  if(error){ toast(error.message); return; }
  r.time_out=out; toast('Record fixed'); render();
}
async function fixTime(){
  const id=$('fixChild').value, day=$('fixDate').value, tin=toMin($('fixIn').value), tout=toMin($('fixOut').value);
  if(!day){ toast('Pick a date'); return; }
  let r=attendance.find(a=>a.child_id===id && a.day===day);
  if(!r){
    if(tin==null){ toast('Time in is required for a new record'); return; }
    const { data, error } = await sb.from('attendance').insert({child_id:id,day,time_in:tin,time_out:tout}).select().single();
    if(error){ toast(error.message); return; } attendance.push(data);
  } else {
    const patch={}; if(tin!=null) patch.time_in=tin; if(tout!=null) patch.time_out=tout;
    if(!Object.keys(patch).length){ toast('Enter a time to change'); return; }
    const { error } = await sb.from('attendance').update(patch).eq('id',r.id);
    if(error){ toast(error.message); return; } Object.assign(r,patch);
  }
  toast('Times updated'); render();
}

let billMonth = (function(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; })();
let genModes = {};

    </div>`;
}
function startGenerate(){ genModes={}; const billed=new Set(invoices.filter(i=>i.month===billMonth&&i.stage!=='revised').flatMap(i=>i.childModes.map(cm=>cm.child_id))); active().filter(c=>!billed.has(c.id)&&recsMonth(c.id,billMonth).length>0).forEach(c=>genModes[c.id]=proposeMode(c,billMonth)); view={generate:true}; renderBilling(); }
function renderGenerate(){
  const billed=new Set(invoices.filter(i=>i.month===billMonth&&i.stage!=='revised').flatMap(i=>i.childModes.map(cm=>cm.child_id)));
  const kids=active().filter(c=>!billed.has(c.id)&&recsMonth(c.id,billMonth).length>0);

      ${kids.map(c=>{const n=recsMonth(c.id,billMonth).length; return `<div class="row"><div class="grow"><div class="name">${esc(c.name)}</div><div class="sub">${n} days · suggested ${proposeMode(c,billMonth)}</div></div>
        <div class="seg"><button class="${genModes[c.id]==='monthly'?'on':''}" data-act="genMode" data-id="${c.id}|monthly">Monthly</button><button class="${genModes[c.id]==='hourly'?'on':''}" data-act="genMode" data-id="${c.id}|hourly">Hourly</button></div></div>`;}).join('')}
    </div>
    <button class="btn" data-act="doGenerate">Create draft bills</button>

async function doGenerate(){
  const billed=new Set(invoices.filter(i=>i.month===billMonth&&i.stage!=='revised').flatMap(i=>i.childModes.map(cm=>cm.child_id)));
  for(const pr of parents){
    const kids=active().filter(c=>c.parent_id===pr.id && !billed.has(c.id) && recsMonth(c.id,billMonth).length>0);
    if(!kids.length) continue;
    const groups=(pr.combine && kids.length>1)?[kids]:kids.map(k=>[k]);
    for(const g of groups){
      const { data:no, error:ne } = await sb.rpc('next_invoice_no',{p_month:billMonth}); if(ne){ toast(ne.message); return; }
      const { data:invRow, error } = await sb.from('invoices').insert({invoice_no:no, parent_id:pr.id, month:billMonth, stage:'draft', total:0}).select().single();
      if(error){ toast(error.message); return; }
      const icPayload=g.map(k=>({invoice_id:invRow.id, child_id:k.id, mode:genModes[k.id]||proposeMode(k,billMonth)}));
      const { error:ie } = await sb.from('invoice_children').insert(icPayload); if(ie){ toast(ie.message); return; }
      const inv={ id:invRow.id, no, rev:0, parent_id:pr.id, month:billMonth, stage:'draft', issued:null, due:null, total:0, childModes:icPayload.map(x=>({child_id:x.child_id,mode:x.mode})), storedChildLines:[], extras:[], payments:[] };
      inv.total=invoiceTotal(inv); await sb.from('invoices').update({total:inv.total}).eq('id',inv.id);
      invoices.push(inv);
    }
  }
  view={}; toast('Draft bills created'); renderBilling();
}

function billText(inv){

const waLink = inv => `https://wa.me/${parents.find(p=>p.id===inv.parent_id).wa}?text=${encodeURIComponent(billText(inv))}`;
async function addExtra(id){ const inv=invoices.find(i=>i.id===id); const desc=$('x_desc').value.trim(), amt=+$('x_amt').value; if(!desc||!amt){ toast('Description and amount needed'); return; } const { data, error } = await sb.from('invoice_lines').insert({invoice_id:id, child_id:null, kind:'extra', description:desc, amount:amt}).select().single(); if(error){ toast(error.message); return; } inv.extras.push({id:data.id, desc, amt}); inv.total=invoiceTotal(inv); await sb.from('invoices').update({total:inv.total}).eq('id',id); toast('Item added'); renderBilling(); }

async function addPayment(id){ const inv=invoices.find(i=>i.id===id); const amt=+$('p_amt').value; if(!(amt>0)){ toast('Enter an amount'); return; } const { data, error } = await sb.from('payments').insert({invoice_id:id, amount:amt, method:$('p_method').value, paid_on:$('p_date').value||todayISO()}).select().single(); if(error){ toast(error.message); return; } inv.payments.push({id:data.id, amt, method:data.method, paid_on:data.paid_on}); toast(invoiceBalance(inv)<=0?'Paid in full':`Balance ${rm(invoiceBalance(inv))}`); renderBilling(); }
async function waiveInvoice(id){ const inv=invoices.find(i=>i.id===id); const paid=invoicePaid(inv); if(!confirm(paid>0?'Waive the remaining balance?':'Waive this whole bill?')) return; if(paid>0){ const bal=invoiceBalance(inv); const { data, error } = await sb.from('invoice_lines').insert({invoice_id:id, child_id:null, kind:'extra', description:'Balance waived by owner', amount:-bal}).select().single(); if(error){ toast(error.message); return; } inv.extras.push({id:data.id, desc:'Balance waived by owner', amt:-bal}); inv.total=invoiceTotal(inv); await sb.from('invoices').update({total:inv.total}).eq('id',id); } else { const { error } = await sb.from('invoices').update({stage:'waived'}).eq('id',id); if(error){ toast(error.message); return; } inv.stage='waived'; } toast('Waived'); renderBilling(); }
async function discardDraft(id){ if(!confirm('Discard this draft bill?')) return; const { error } = await sb.from('invoices').delete().eq('id',id); if(error){ toast(error.message); return; } invoices=invoices.filter(i=>i.id!==id); view={}; toast('Draft discarded'); renderBilling(); }
async function reviseInvoice(id){
  const inv=invoices.find(i=>i.id===id);
  const { data:no, error:ne } = await sb.rpc('next_invoice_no',{p_month:inv.month}); // not used for number; keep same no
  const { data:invRow, error } = await sb.from('invoices').insert({invoice_no:inv.no, rev:inv.rev+1, parent_id:inv.parent_id, month:inv.month, stage:'draft', total:0}).select().single();
  if(error){ toast(error.message); return; }
  const icPayload=inv.childModes.map(cm=>({invoice_id:invRow.id, child_id:cm.child_id, mode:cm.mode}));
  await sb.from('invoice_children').insert(icPayload);
  const newExtras=[]; for(const e of inv.extras){ const { data } = await sb.from('invoice_lines').insert({invoice_id:invRow.id, child_id:null, kind:'extra', description:e.desc, amount:e.amt}).select().single(); if(data) newExtras.push({id:data.id, desc:e.desc, amt:e.amt}); }
  for(const pm of inv.payments){ await sb.from('payments').update({invoice_id:invRow.id}).eq('id',pm.id); }
  const rInv={ id:invRow.id, no:inv.no, rev:inv.rev+1, parent_id:inv.parent_id, month:inv.month, stage:'draft', issued:null, due:null, total:0, childModes:icPayload.map(x=>({child_id:x.child_id,mode:x.mode})), storedChildLines:[], extras:newExtras, payments:inv.payments.map(x=>({...x})) };
  rInv.total=invoiceTotal(rInv); await sb.from('invoices').update({total:rInv.total}).eq('id',rInv.id);
  await sb.from('invoices').update({stage:'revised'}).eq('id',inv.id); inv.stage='revised'; inv.payments=[];
  invoices.push(rInv); view={invoice:rInv.id}; toast(`Draft ${invNo(rInv)} created`); renderBilling();
}

function loadImg(src){ return new Promise((res,rej)=>{ if(!src) return res(null); const im=new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src=src; }); }
async function saveBillImage(id){
  const inv=invoices.find(i=>i.id===id), pr=parents.find(x=>x.id===inv.parent_id), st=statusOf(inv), groups=invoiceGroups(inv);
  const rows=[]; groups.forEach(g=>{ if(groups.length>1) rows.push(['h',g.name]); g.lines.forEach(l=>rows.push(['l',l.desc,rm(l.amt)])); }); inv.extras.forEach(e=>rows.push(['l',e.desc,rm(e.amt)]));
  const logo=$('logoImg'), qr=await loadImg(settings.bank_qr||'');
  const W=760, pad=40, lineH=30; const headH=170, footH=(settings.bank?28:0)+(qr?230:70)+40;
  const H=headH + 40 + rows.length*lineH + 60 + (invoicePaid(inv)>0?60:0) + footH;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H; const cx=cv.getContext('2d');
  cx.fillStyle='#ffffff'; cx.fillRect(0,0,W,H);
  try{ if(logo&&logo.complete) cx.drawImage(logo, pad, 30, 110, 110); }catch(e){}
  cx.fillStyle='#2F7A5B'; cx.font='bold 30px sans-serif'; cx.fillText(settings.nursery_name||"Mommy's Nursery", pad+130, 68);
  cx.fillStyle='#5E6E6A'; cx.font='14px sans-serif';
  (settings.address||'').match(/.{1,52}(\s|$)/g)?.slice(0,2).forEach((ln,i)=>cx.fillText(ln.trim(), pad+130, 92+i*18));
  if(settings.phone) cx.fillText('Tel '+settings.phone, pad+130, 128);
  cx.strokeStyle='#DCE3DF'; cx.beginPath(); cx.moveTo(pad,160); cx.lineTo(W-pad,160); cx.stroke();
  cx.fillStyle='#1B2A27'; cx.font='bold 22px sans-serif'; cx.fillText(st==='Paid'?'RECEIPT':'BILL', pad, 195);
  cx.font='14px sans-serif'; cx.textAlign='right';
  cx.fillText(`${invNo(inv)}   ${monthLabel(inv.month)}`, W-pad, 190);
  cx.fillText(`${pr.mother||''}${pr.father?' / '+pr.father:''}   ${invNames(inv)}`, W-pad, 210);
  cx.textAlign='left';
  let y=250; cx.font='16px sans-serif';
  rows.forEach(r=>{ if(r[0]==='h'){ cx.fillStyle='#2F7A5B'; cx.font='bold 16px sans-serif'; cx.fillText(r[1],pad,y); cx.font='16px sans-serif'; } else { cx.fillStyle='#1B2A27'; cx.fillText(r[1].length>58?r[1].slice(0,56)+'…':r[1],pad,y); cx.textAlign='right'; cx.fillText(r[2],W-pad,y); cx.textAlign='left'; } y+=lineH; });
  cx.strokeStyle='#1B2A27'; cx.beginPath(); cx.moveTo(pad,y-8); cx.lineTo(W-pad,y-8); cx.stroke();
  y+=18; cx.font='bold 20px sans-serif'; cx.fillText('Total', pad, y); cx.textAlign='right'; cx.fillText(rm(invoiceTotal(inv)), W-pad, y); cx.textAlign='left';
  if(invoicePaid(inv)>0){ y+=28; cx.font='15px sans-serif'; cx.fillText('Paid so far', pad, y); cx.textAlign='right'; cx.fillText(rm(invoicePaid(inv)), W-pad, y); cx.textAlign='left'; y+=24; cx.fillText(st==='Paid'?'Balance':'Balance due', pad, y); cx.textAlign='right'; cx.fillText(rm(Math.max(0,invoiceBalance(inv))), W-pad, y); cx.textAlign='left'; }
  y+=44; cx.fillStyle='#5E6E6A'; cx.font='14px sans-serif';
  if(st!=='Paid' && inv.due) cx.fillText('Please pay by '+fmtDate(inv.due)+'.', pad, y), y+=20;
  if(settings.bank){ cx.fillText('Bank: '+settings.bank, pad, y); y+=6; }
  if(qr){ y+=10; cx.fillStyle='#1B2A27'; cx.font='bold 15px sans-serif'; cx.fillText('Scan to pay (DuitNow):', pad, y+18); try{ cx.drawImage(qr, pad, y+28, 180, 180); }catch(e){} cx.fillStyle='#5E6E6A'; cx.font='13px sans-serif'; cx.fillText('Scan, then enter the total above.', pad+200, y+120); }
  const name=`${invNo(inv)}-${invNames(inv).replace(/[^a-z0-9]+/gi,'-')}.png`;
  cv.toBlob(b=>{ if(!b){ toast('Could not make the image'); return; } const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); a.remove(); toast('Bill image saved'); }, 'image/png');
}

async function saveChild(id){
  const isNew = id==='new';
  const payload={ name:$('f_name').value.trim(), dob:$('f_dob').value||null, admitted:$('f_adm').value||null, category:$('f_cat').value, plan_id:$('f_plan').value, monthly:+$('f_monthly').value||0, hourly:+$('f_hourly').value||0, medical:$('f_med').value, parent_id:$('f_parent').value };
  const chosen=[...document.querySelectorAll('[data-addon]:checked')].map(x=>x.dataset.addon);
  if(!payload.name){ toast('Name is required'); return; }
  if(!payload.parent_id){ toast('Pick a family'); return; }
  if(isNew){
    const { data, error } = await sb.from('children').insert(payload).select().single();
    if(error){ toast(error.message); return; }
    const child={status:'active', withdrawn_on:null, ...data, monthly:num(data.monthly), hourly:num(data.hourly), addons:[]};
    if(chosen.length){ const { error:e2 } = await sb.from('child_addons').insert(chosen.map(a=>({child_id:child.id,addon_id:a}))); if(e2){ toast(e2.message);} else child.addons=chosen; }
    children.push(child); view={child:child.id};
  } else {
    const c=children.find(x=>x.id===id);
    const { error } = await sb.from('children').update(payload).eq('id',id);
    if(error){ toast(error.message); return; }
    const add=chosen.filter(a=>!c.addons.includes(a)), remove=c.addons.filter(a=>!chosen.includes(a));
    if(add.length){ const {error:e2}=await sb.from('child_addons').insert(add.map(a=>({child_id:id,addon_id:a}))); if(e2) toast(e2.message); }
    if(remove.length){ const {error:e3}=await sb.from('child_addons').delete().eq('child_id',id).in('addon_id',remove); if(e3) toast(e3.message); }
    Object.assign(c, payload, {monthly:num(payload.monthly),hourly:num(payload.hourly), addons:chosen}); view={child:id};
  }
  toast('Saved'); renderChildren();
}
async function withdraw(id){
  const date=$('wd_date').value || new Date().toISOString().slice(0,10);
  const { error } = await sb.from('children').update({status:'withdrawn',withdrawn_on:date}).eq('id',id);
  if(error){ toast(error.message); return; }
  const c=children.find(x=>x.id===id); c.status='withdrawn'; c.withdrawn_on=date;
  childFilter='Former'; view={}; toast('Marked as withdrawn'); renderChildren();
}
async function reactivate(id){
  const { error } = await sb.from('children').update({status:'active',withdrawn_on:null}).eq('id',id);
  if(error){ toast(error.message); return; }
  const c=children.find(x=>x.id===id); c.status='active'; c.withdrawn_on=null;
  childFilter='Active'; view={}; toast('Active again'); renderChildren();
}
async function deleteChild(id){
  if(!confirm('Delete this child permanently?')) return;
  const [{ count: att }, { count: inv }] = await Promise.all([
    sb.from('attendance').select('id',{count:'exact',head:true}).eq('child_id',id),
    sb.from('invoice_children').select('child_id',{count:'exact',head:true}).eq('child_id',id),
  ]);
  if((att||0)+(inv||0)>0){ toast('Has records — withdraw instead of delete'); return; }
  const { error } = await sb.from('children').delete().eq('id',id);
  if(error){ toast(error.message); return; }
  children=children.filter(c=>c.id!==id); view={}; toast('Deleted'); renderChildren();
}

      <div class="actions"><button class="btn small ghost" data-act="exportCsv" data-id="attendance">Attendance</button><button class="btn small ghost" data-act="exportCsv" data-id="invoices">Bills</button><button class="btn small ghost" data-act="exportCsv" data-id="payments">Payments</button></div>
    </div>
    <div class="card"><h2>Account</h2>
      <div class="actions"><button class="btn small ghost" data-act="signOut">Sign out</button></div>
    </div>`;
}
function renderFamilyForm(id){
  const isNew=id==='new';
  const p=isNew?{mother:'',father:'',wa:'',address:'',emergency:'',combine:true}:parents.find(x=>x.id===id);
  $('more').innerHTML = `
    <button class="back" data-act="closeView">‹ Settings</button>
    <div class="card"><h2>${isNew?'New family':'Edit family'}</h2>
      <label>Mother's name</label><input id="p_mother" value="${esc(p.mother)}">
      <label>Father / guardian's name</label><input id="p_father" value="${esc(p.father)}">
      <label>WhatsApp number (with country code)</label><input id="p_wa" value="${esc(p.wa)}" placeholder="60123456789">
      <label>Address</label><input id="p_addr" value="${esc(p.address)}">
      <label>Emergency contact</label><input id="p_emerg" value="${esc(p.emergency)}">
      <label class="check" style="margin-top:12px"><input type="checkbox" id="p_combine" ${p.combine?'checked':''}> Combine siblings into one monthly bill</label>
      <div class="actions"><button class="btn" data-act="saveFamily" data-id="${id}">Save family</button></div>
      ${isNew?'':`<div class="actions"><button class="btn danger" data-act="deleteFamily" data-id="${id}">Delete family</button></div><div class="sub" style="margin-top:6px">Only possible when the family has no children and no bills. Otherwise keep it; former families sit under their own heading.</div>`}
    </div>`;
}
async function saveFamily(id){
  const payload={ mother:$('p_mother').value.trim(), father:$('p_father').value.trim(), wa:$('p_wa').value.replace(/\D/g,''), address:$('p_addr').value.trim(), emergency:$('p_emerg').value.trim(), combine:$('p_combine').checked };
  if(!payload.mother||!payload.wa){ toast('Mother and WhatsApp number are required'); return; }
  if(id==='new'){ const { data, error } = await sb.from('parents').insert(payload).select().single(); if(error){ toast(error.message); return; } parents.push(data); }
  else { const { error } = await sb.from('parents').update(payload).eq('id',id); if(error){ toast(error.message); return; } Object.assign(parents.find(p=>p.id===id), payload); }
  view={}; toast('Family saved'); renderMore();
}
async function deleteFamily(id){
  const kids=children.filter(c=>c.parent_id===id);
  if(kids.length){ toast('Has children — withdraw them; the family moves to Former'); return; }
  const { count } = await sb.from('invoices').select('id',{count:'exact',head:true}).eq('parent_id',id);
  if((count||0)>0){ toast('Has bills on record — cannot delete'); return; }
  if(!confirm('Delete this family permanently?')) return;
  const { error } = await sb.from('parents').delete().eq('id',id);
  if(error){ toast(error.message); return; }
  parents=parents.filter(x=>x.id!==id); view={}; toast('Family deleted'); renderMore();
}
async function toggleCombine(id){
  const p=parents.find(x=>x.id===id); const val=!p.combine;
  const { error } = await sb.from('parents').update({combine:val}).eq('id',id);
  if(error){ toast(error.message); return; }
  p.combine=val; toast(val?'Siblings share one bill':'Each child billed separately');
}
function renderAddonForm(id){
  const isNew=id==='new';
  const a=isNew?{name:'',price:''}:addons.find(x=>x.id===id);
  const n=isNew?0:active().filter(c=>c.addons.includes(id)).length;
  $('more').innerHTML = `
    <button class="back" data-act="closeView">‹ Settings</button>
    <div class="card"><h2>${isNew?'New add-on':'Edit add-on'}</h2>
      <label>Name</label><input id="a_name" value="${esc(a.name)}" placeholder="e.g. Battery bouncer">
      <label>Price per month (RM)</label><input type="number" id="a_price" value="${a.price}" placeholder="0.00">
      <div class="actions"><button class="btn" data-act="saveAddon" data-id="${id}">Save add-on</button></div>
      ${isNew?'':`<div class="actions"><button class="btn danger" data-act="deleteAddon" data-id="${id}">Remove add-on${n?` (removes from ${n} ${n===1?'child':'children'})`:''}</button></div>`}
    </div>`;
}
async function saveAddon(id){
  const name=$('a_name').value.trim(), price=+$('a_price').value;
  if(!name||!(price>=0)){ toast('Name and a valid price are required'); return; }
  if(id==='new'){ const { data, error } = await sb.from('addons').insert({name,price}).select().single(); if(error){ toast(error.message); return; } addons.push({...data,price:num(data.price)}); }
  else { const { error } = await sb.from('addons').update({name,price}).eq('id',id); if(error){ toast(error.message); return; } Object.assign(addons.find(a=>a.id===id),{name,price}); }
  view={}; toast('Add-on saved'); renderMore();
}
async function deleteAddon(id){
  if(!confirm('Remove this add-on?')) return;
  const { error } = await sb.from('addons').delete().eq('id',id);
  if(error){ toast(error.message); return; }
  addons=addons.filter(a=>a.id!==id); children.forEach(c=>c.addons=c.addons.filter(x=>x!==id));
  view={}; toast('Add-on removed'); renderMore();
}

async function saveTimes(){
  const open=toMin($('s_open').value);
  if(open==null){ toast('Enter the opening time'); return; }
  const ends=[...document.querySelectorAll('[data-planend]')].map(el=>({id:el.dataset.planend, end:toMin(el.value)}));
  if(ends.some(e=>e.end==null)){ toast('Enter every plan end time'); return; }
  const { error } = await sb.from('settings').update({open_minutes:open}).eq('owner_id', settings.owner_id);
  if(error){ toast(error.message); return; }
  settings.open_minutes=open;
  for(const e of ends){ const { error:pe } = await sb.from('plans').update({end_minutes:e.end}).eq('id',e.id); if(pe){ toast(pe.message); return; } const pl=plans.find(x=>x.id===e.id); if(pl) pl.end_minutes=e.end; }
  toast('Times saved'); renderMore();
}

async function saveRules(){
  const patch={ hourly_threshold:Math.max(0,+$('s_thr').value||0), due_day:Math.min(28,Math.max(1,+$('s_due').value||7)), overtime_rate:Math.max(0,+$('s_ot').value||0) };
  const { error } = await sb.from('settings').update(patch).eq('owner_id',settings.owner_id); if(error){ toast(error.message); return; }
  Object.assign(settings,patch); toast('Rules saved'); renderMore();
}
async function saveDetails(){
  const patch={ nursery_name:$('s_name').value.trim()||"Mommy's Nursery", address:$('s_addr').value.trim(), phone:$('s_phone').value.trim(), bank:$('s_bank').value.trim() };
  const { error } = await sb.from('settings').update(patch).eq('owner_id',settings.owner_id); if(error){ toast(error.message); return; }
  Object.assign(settings,patch); toast('Details saved'); renderMore();
}
async function onQrFile(file){
  if(!file){ return; }
  if(file.size > 900000){ toast('Image too large; use one under ~900 KB'); return; }
  const dataUrl = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
  const { error } = await sb.from('settings').update({bank_qr:dataUrl}).eq('owner_id',settings.owner_id);
  if(error){ toast(error.message.includes('bank_qr')?'Run the bank_qr column SQL first':error.message); return; }
  settings.bank_qr=dataUrl; toast('QR uploaded'); renderMore();
}
async function removeQr(){ const { error } = await sb.from('settings').update({bank_qr:''}).eq('owner_id',settings.owner_id); if(error){ toast(error.message); return; } settings.bank_qr=''; toast('QR removed'); renderMore(); }
function csvCell(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }
function downloadCsv(name, rows){ const txt=rows.map(r=>r.map(csvCell).join(',')).join('\r\n'); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv'})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); toast('CSV saved'); }
function exportCsv(kind){
  const m=billMonth;
  if(kind==='attendance'){ const rows=[['Date','Child','Time in','Time out','Early OT(h)','Late OT(h)','Billable min']]; attendance.filter(a=>a.day.startsWith(m)).sort((a,b)=>a.day.localeCompare(b.day)).forEach(a=>{ const c=children.find(x=>x.id===a.child_id); rows.push([fmtDate(a.day), c?c.name:'—', fmtTime(a.time_in), fmtTime(a.time_out), otEarly(a), c?otLate(a,c):0, c?hourlyMinutes(a,c):0]); }); downloadCsv(`attendance-${m}.csv`,rows); }
  if(kind==='invoices'){ const rows=[['Invoice','Children','Month','Status','Total','Paid','Balance','Issued','Due']]; invoices.filter(i=>i.month===m).forEach(i=>rows.push([invNo(i), invNames(i), monthLabel(i.month), statusOf(i), invoiceTotal(i).toFixed(2), invoicePaid(i).toFixed(2), invoiceBalance(i).toFixed(2), fmtDate(i.issued), fmtDate(i.due)])); downloadCsv(`bills-${m}.csv`,rows); }
  if(kind==='payments'){ const rows=[['Date','Invoice','Children','Amount','Method']]; invoices.forEach(i=>i.payments.forEach(pm=>{ if((pm.paid_on||'').startsWith(m)) rows.push([fmtDate(pm.paid_on), invNo(i), invNames(i), pm.amt.toFixed(2), pm.method]); })); downloadCsv(`payments-${m}.csv`,rows); }
}

/* ---------- events ---------- */
const ACTIONS={
  goTab:id=>go(id), tapIn:id=>tapIn(id), tapOut:id=>tapOut(id), fixOpen:id=>fixOpen(id), fixTime, saveTimes,
  setBillMonth:id=>{ billMonth=id; if(tab==='more') renderMore(); else renderBilling(); },
  startGenerate, genMode:arg=>{ const [id,m]=arg.split('|'); genModes[id]=m; renderBilling(); }, doGenerate,
  openInvoice:id=>{ if(tab!=='billing') go('billing'); const inv=invoices.find(i=>i.id===id); if(inv) billMonth=inv.month; view={invoice:id}; renderBilling(); },
  addExtra:id=>addExtra(id), removeExtra:arg=>removeExtra(arg), sendInvoice:id=>sendInvoice(id), addPayment:id=>addPayment(id), waiveInvoice:id=>waiveInvoice(id), discardDraft:id=>discardDraft(id), reviseInvoice:id=>reviseInvoice(id), saveBillImage:id=>saveBillImage(id),
  saveRules, saveDetails, removeQr, exportCsv:id=>exportCsv(id),
  filter:id=>{childFilter=id; renderChildren();},
  openChild:id=>{ if(tab!=='children') go('children'); view={child:id}; renderChildren(); },
  openParent:id=>{ view={parent:id}; renderChildren(); },
  newChild:()=>{ view={edit:'new'}; renderChildren(); }, editChild:id=>{ view={edit:id}; renderChildren(); },
  saveChild, withdraw, reactivate, deleteChild, closeView:()=>{ view={}; render(); },
  newFamily:()=>{ view={family:'new'}; renderMore(); }, editFamily:id=>{ if(tab!=='more'){ view={parent:id}; renderChildren(); return;} view={family:id}; renderMore(); },
  saveFamily, toggleCombine, deleteFamily,
  newAddon:()=>{ view={addon:'new'}; renderMore(); }, editAddon:id=>{ view={addon:id}; renderMore(); }, saveAddon, deleteAddon,
  signOut,
};
document.querySelectorAll('nav.tabs button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.tab)));
document.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(!el||el.disabled) return; if(el.tagName==='INPUT'&&el.type==='checkbox'&&el.dataset.act!=='toggleCombine') return; if(el.closest('a')) return; if(el.dataset.act==='toggleCombine'&&e.target!==el) return; try{ ACTIONS[el.dataset.act](el.dataset.id); }catch(err){ console.error(err); toast('Something went wrong'); } });
document.addEventListener('change',e=>{ if(e.target.id==='qrFile'){ onQrFile(e.target.files && e.target.files[0]); } });

// resume session if already signed in
sb.auth.getSession().then(({data})=>{ if(data.session) startApp(); });
</script>
